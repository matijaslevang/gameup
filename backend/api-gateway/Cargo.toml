[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tower-http = { version = "0.5", features = ["cors"] }
serde_json = "1"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
axum-extra = "0.9"