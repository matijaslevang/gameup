version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: gameup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gameup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  game-service:
    build: ./backend/game-service
    container_name: game-service
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gameup

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - game-service
    environment:
      JWT_SECRET: supersecretkey

  auth-service:
    build: ./backend/auth-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gameup
      JWT_SECRET: supersecretkey
    depends_on:
      - postgres

  image-service:
    build: ./backend/image-service
    container_name: image-service
    ports:
      - "8003:8003"
    volumes:
      - ./uploads:/app/uploads

  video-service:
    build: ./backend/video-service
    container_name: video-service
    ports:
      - "8004:8004"
    volumes:
      - ./video:/app/video

volumes:
  postgres_data: