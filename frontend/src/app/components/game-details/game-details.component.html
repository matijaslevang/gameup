<div class="game-page">

  <div class="game-header">
    <div class="title-row">
      <h1>{{ game?.name }}</h1>

      <div class="actions">
        <button class="edit-btn" (click)="onEdit()">Edit</button>
        <button class="delete-btn" (click)="onDelete()">Delete</button>
      </div>
    </div>

    <p class="meta">
      <span>{{ game?.genre }}</span> •
      <span>Released {{ game?.release_date | date }}</span>
    </p>
  </div>

  <div class="game-content">
    <p class="description">{{ game?.description }}</p>
  </div>

  <div *ngIf="images.length > 0" class="section">
    <h2>Images</h2>

    <div class="carousel">

      <button class="nav left" (click)="prevImage()">‹</button>

      <div class="image-wrapper">
        <img
          [src]="images[currentImageIndex]"
          [class.fade]="true"
          alt="Game image"
        />
      </div>

      <button class="nav right" (click)="nextImage()">›</button>
    </div>

    <div class="dots">
      <span
        *ngFor="let img of images; let i = index"
        [class.active]="i === currentImageIndex"
        (click)="currentImageIndex = i">
      </span>
    </div>
  </div>

  <div *ngIf="videos.length > 0" class="section">
    <h2>Videos</h2>

    <div class="video-grid">
      <div class="video-wrapper" *ngFor="let video of videos">
        <video [src]="video" controls></video>
      </div>
    </div>
  </div>

</div>
